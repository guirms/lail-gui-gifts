<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Presentes – Guilherme & Laís</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <h1>🎁 Lista de Presentes</h1>
        <p>Guilherme &amp; Laís</p>
    </header>

    <main>
        <section id="add-gift">
            <h2>Adicionar presente</h2>
            <form id="giftForm">
                <div class="form-group">
                    <label for="title">Nome do presente:</label>
                    <input type="text" id="title" name="title" required placeholder="Ex.: Camisa legal">
                </div>
                <div class="form-group">
                    <label for="link">Link do produto:</label>
                    <input type="url" id="link" name="link" required placeholder="https://...">
                </div>
                <div class="form-group">
                    <label for="description">Descrição (opcional):</label>
                    <textarea id="description" name="description" rows="3" placeholder="Tamanho, cor, etc."></textarea>
                </div>
                <div class="form-group">
                    <label for="price">Preço (opcional):</label>
                    <input type="number" id="price" name="price" step="0.01" min="0" placeholder="R$ 0,00">
                </div>
                <div class="form-group">
                    <label for="addedBy">Quem adicionou:</label>
                    <select id="addedBy" name="addedBy" required>
                        <option value="Guilherme">Guilherme</option>
                        <option value="Laís">Laís</option>
                    </select>
                </div>
                <button type="submit" id="addBtn">Adicionar presente</button>
            </form>
        </section>

        <section id="gift-list">
            <h2>Presentes desejados</h2>
            <div class="filter-row">
                <label for="filterBy">Filtrar por:</label>
                <select id="filterBy" name="filterBy">
                    <option value="all">Todos</option>
                    <option value="Guilherme">Guilherme</option>
                    <option value="Laís">Laís</option>
                </select>
            </div>
            <ul id="gifts"></ul>
        </section>
    </main>

    <footer>
        <p>Feito com ❤️ por Guilherme &amp; Laís</p>
    </footer>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="script.js"></script>
</body>
</html>
